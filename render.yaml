services:
  - type: web
    name: video-analytics-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    buildCommand: |
      apt-get update
      apt-get install -y ffmpeg
      pip install -r requirements.txt